name: Update IP Lists by Country

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ip-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download and process IP data
        run: |
          python << 'EOF'
          import csv
          import datetime
          import gzip
          import ipaddress
          import os
          import re
          import sys
          import unicodedata
          from collections import defaultdict

          import requests

          BASE_URL = "https://download.db-ip.com/free/dbip-city-lite-{}-{}.csv.gz"
          MIN_COUNTRIES = 150   # sanity check: DB-IP has ~240, refuse to commit if far fewer
          OUT_DIR = "country"


          def normalize_city_name(city):
              """Lowercase, strip Vietnamese diacritics, drop spaces/special chars."""
              if not city or city == 'Unknown':
                  return 'unknown'
              city = unicodedata.normalize('NFD', city)
              city = ''.join(c for c in city if unicodedata.category(c) != 'Mn')
              city = re.sub(r'[^a-z0-9]', '', city.lower())
              return city or 'unknown'


          def find_latest_url():
              dt = datetime.datetime.now(datetime.timezone.utc).replace(day=1)
              for _ in range(12):
                  url = BASE_URL.format(dt.year, f"{dt.month:02d}")
                  try:
                      if requests.head(url, timeout=10).status_code == 200:
                          return url
                  except requests.RequestException:
                      pass
                  dt = (dt - datetime.timedelta(days=1)).replace(day=1)
              return None


          def download(url, path):
              with requests.get(url, stream=True, timeout=(10, 120)) as r:
                  r.raise_for_status()
                  with open(path, 'wb') as f:
                      for chunk in r.iter_content(1 << 20):
                          f.write(chunk)


          def merge_ranges(ranges):
              """Sort and merge overlapping/adjacent [start, end] integer ranges."""
              merged = []
              for s, e in sorted(ranges):
                  if merged and s <= merged[-1][1] + 1:
                      if e > merged[-1][1]:
                          merged[-1][1] = e
                  else:
                      merged.append([s, e])
              return merged


          def to_cidrs(merged):
              out = []
              for s, e in merged:
                  for net in ipaddress.summarize_address_range(
                          ipaddress.IPv4Address(s), ipaddress.IPv4Address(e)):
                      out.append(str(net))
              return out


          def process(path):
              ranges = defaultdict(list)       # country code -> [[start, end], ...]
              vn_cities = defaultdict(list)    # normalized VN province/city -> [cidr, ...]
              rows = 0

              with gzip.open(path, 'rt', encoding='utf-8', newline='') as f:
                  # csv.reader handles quoted fields (names containing commas)
                  for row in csv.reader(f):
                      if len(row) < 5:
                          continue
                      ip_start, ip_end = row[0], row[1]
                      cc = row[3].strip().upper()
                      if ':' in ip_start or cc == 'ZZ' or not re.fullmatch(r'[A-Z]{2}', cc):
                          continue                 # skip IPv6, unknown and malformed rows
                      try:
                          s = int(ipaddress.IPv4Address(ip_start))
                          e = int(ipaddress.IPv4Address(ip_end))
                      except ValueError:
                          continue
                      if e < s:
                          continue
                      rows += 1

                      lst = ranges[cc]
                      # DB-IP is sorted, so adjacent rows of one country collapse on the fly (low memory)
                      if lst and lst[-1][0] <= s <= lst[-1][1] + 1:
                          if e > lst[-1][1]:
                              lst[-1][1] = e
                      else:
                          lst.append([s, e])

                      if cc == 'VN':
                          city = normalize_city_name(row[4])
                          for net in ipaddress.summarize_address_range(
                                  ipaddress.IPv4Address(s), ipaddress.IPv4Address(e)):
                              vn_cities[city].append(str(net))

              print(f"IPv4 rows read: {rows}")
              print(f"Countries found: {len(ranges)}")

              if len(ranges) < MIN_COUNTRIES or 'VN' not in ranges:
                  print("Sanity check failed (too few countries / VN missing). Nothing written.")
                  sys.exit(1)

              # --- one file per country: country/<cc>.txt (aggregated IPv4 CIDRs) ---
              os.makedirs(OUT_DIR, exist_ok=True)
              counts = {}
              for cc, lst in sorted(ranges.items()):
                  cidrs = to_cidrs(merge_ranges(lst))
                  counts[cc] = len(cidrs)
                  with open(f"{OUT_DIR}/{cc.lower()}.txt", 'w') as f:
                      f.write('\n'.join(cidrs) + '\n')
              print(f"Wrote {len(counts)} files to {OUT_DIR}/")

              # --- backward compatible: vietnam.txt + per-city files ---
              with open('vietnam.txt', 'w') as f:
                  f.write('\n'.join(to_cidrs(merge_ranges(ranges['VN']))) + '\n')
              for city, nets in sorted(vn_cities.items()):
                  with open(f"{city}.txt", 'w') as f:
                      f.write('\n'.join(sorted(set(nets))) + '\n')
              print(f"Wrote vietnam.txt and {len(vn_cities)} VN city files")

              print("\n=== Top 10 countries by CIDR count ===")
              for cc, n in sorted(counts.items(), key=lambda x: x[1], reverse=True)[:10]:
                  print(f"{cc}: {n}")


          def main():
              print("Looking for the latest DB-IP release...")
              url = find_latest_url()
              if not url:
                  print("No valid download link found!")
                  sys.exit(1)
              print(f"Downloading: {url}")
              download(url, 'dbip.csv.gz')
              print("Processing...")
              process('dbip.csv.gz')
              os.remove('dbip.csv.gz')
              print("Done!")


          if __name__ == "__main__":
              main()
          EOF

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A -- '*.txt'
          git commit -m "Update IP lists [$(date +'%Y-%m-%d')]" || exit 0
          git push
